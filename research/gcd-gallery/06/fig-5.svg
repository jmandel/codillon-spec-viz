  <text x="38" y="512" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#00008b">How the Euler Diagram Explains Euclid&#x2019;s Return Proof Obligation in One Glance</text>
  <text x="38" y="535" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#222222">1. <tspan font-weight="bold" fill="#43368a">Loop Invariant (Conservation of Intersection):</tspan> For all d, (d &#x2223; x &#x2227; d &#x2223; y) &#x21D4; (d &#x2223; y &#x2227; d &#x2223; (x mod y)). Thus the lens P&#x2081; &#x2229; P&#x2082; = {1, 2, 4} and P&#x2083; never change.</text>
  <text x="38" y="558" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#222222">2. <tspan font-weight="bold" fill="#43368a">Outer Shedding:</tspan> Each modulo step strips non-common divisors from the outer crescents (first 3, 6, 12 leave P&#x2081;; then 8 leaves P&#x2081;).</text>
  <text x="38" y="581" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#222222">3. <tspan font-weight="bold" fill="#43368a">Exit Collapse (y = 0):</tspan> When y = 0, P&#x2082; (g &#x2223; 0) becomes &#x2115;, so CommonDiv(x, 0) = Div(x). Since x &#x2223; x (P&#x2081;) and every d &#x2208; Div(x) divides x (P&#x2083;),</text>
  <text x="54" y="602" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#00008b">x = 4 automatically inhabits P&#x2081; &#x2229; P&#x2082; &#x2229; P&#x2083; = Gcd(x, 0) = Gcd(12, 8) = {4}.   Q.E.D.</text>
