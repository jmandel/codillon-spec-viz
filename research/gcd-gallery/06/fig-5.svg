  <text x="450" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" fill="#222222">Euclid&#x2019;s Loop Reshapes Outer Circles While Locking Their Intersection</text>
  <text x="450" y="52" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="13" fill="#444444">Loop invariant: Div(x) &#x2229; Div(y) = {1, 2, 4} and Gcd(x, y) = {4} never move as (x, y) steps (12, 8) &#x2192; (8, 4) &#x2192; (4, 0)</text>
