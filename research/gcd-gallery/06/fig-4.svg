  <text x="450" y="32" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" fill="#222222">Dependent Types: Input Values (a, b) Reshape the Conjunct Regions</text>
  <text x="450" y="52" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="13" fill="#444444">Gcd(a, b) is a family of sets indexed by (a, b): changing the term indices moves the boundaries, yet P&#x2081; &#x2229; P&#x2082; &#x2229; P&#x2083; always has size 1</text>
  <defs>
    <clipPath id="f4-q1-pa"><circle cx="165" cy="212" r="62" /></clipPath>
