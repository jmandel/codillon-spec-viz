<g><circle cx="368.0" cy="198.0" r="12.0" fill="#ffffff" stroke="#6e6e6e" stroke-width="1.4" /><text x="368.0" y="202.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">0</text></g>
<g><rect x="326.0" y="220.0" width="84.0" height="24.0" rx="12.0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" /><text x="368.0" y="235.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="normal" fill="#6e6e6e">3, 5, 6, …</text></g>
  <text x="230" y="324" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#222222">P&#x2081; &#x2229; P&#x2082; = {1} is already a singleton; P&#x2083; = &#x2115; cuts nothing further.</text>
  <text x="230" y="342" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#00008b">Result: Gcd(13, 8) = {1}</text>
  <rect x="460" y="66" width="420" height="290" rx="8" fill="#ffffff" stroke="#6e6e6e" stroke-width="1.5" />
  <rect x="460" y="66" width="420" height="40" rx="8" fill="#efedf9" stroke="#6A5ACD" stroke-width="1.2" />
  <text x="474" y="85" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#222222">Case B: Euclid Example (a = 1071, b = 462) &#x2192; Gcd = {21}</text>
  <text x="474" y="100" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#43368a">1071 = 3&#xB2;&#xB7;7&#xB7;17 (12 divisors),  462 = 2&#xB7;3&#xB7;7&#xB7;11 (16 divisors)</text>
  <circle cx="610" cy="192" r="66" fill="#efedf9" fill-opacity="0.7" />
