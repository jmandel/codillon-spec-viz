<g><circle cx="260.0" cy="194.0" r="12.0" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="260.0" y="198.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">2</text></g>
<g><circle cx="260.0" cy="228.0" r="12.0" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="260.0" y="232.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">4</text></g>
