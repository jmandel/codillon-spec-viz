  <circle cx="647" cy="250" r="66" fill="none" stroke="#43368a" stroke-width="1.9" stroke-dasharray="3,2" />
  <text x="530" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#43368a">P&#x2081;: g &#x2223; 1071</text>
  <text x="720" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#43368a">P&#x2082;: g &#x2223; 462</text>
  <text x="795" y="280" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#43368a">P&#x2083;: 21 &#x2223; g</text>
<g><rect x="603.8" y="141.0" width="62.4" height="22.0" rx="11.0" fill="#ffffff" stroke="#43368a" stroke-width="1.4" /><text x="635.0" y="155.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="normal" fill="#222222">1, 3, 7</text></g>
