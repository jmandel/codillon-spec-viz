<g><rect x="529.6" y="167.0" width="76.8" height="22.0" rx="11.0" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="568.0" y="181.7" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="normal" fill="#222222">9, 17, 51</text></g>
<g><rect x="673.2" y="167.0" width="105.6" height="22.0" rx="11.0" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="726.0" y="181.7" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="normal" fill="#222222">2, 6, 11, 14…</text></g>
