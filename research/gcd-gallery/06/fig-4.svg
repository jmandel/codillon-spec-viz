  <text x="137" y="460" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#43368a">P&#x2081;: g &#x2223; 21</text>
  <text x="293" y="460" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#43368a">P&#x2083;: &#x2200;d&#x2208;Div(21). d&#x2223;g</text>
<g><circle cx="136.0" cy="510.0" r="12.0" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="136.0" y="514.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">1</text></g>
<g><circle cx="136.0" cy="540.0" r="12.0" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="136.0" y="544.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">3</text></g>
<g><circle cx="162.0" cy="525.0" r="12.0" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="162.0" y="529.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">7</text></g>
<g><circle cx="210.0" cy="526.0" r="15.5" fill="#e6eaf5" stroke="#00008b" stroke-width="2.5" /><text x="210.0" y="530.9" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#00008b">21</text></g>
<g><circle cx="272.0" cy="510.0" r="12.0" fill="#ffffff" stroke="#43368a" stroke-width="1.4" /><text x="272.0" y="514.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">0</text></g>
<g><rect x="243.8" y="530.5" width="62.4" height="23.0" rx="11.5" fill="#ffffff" stroke="#43368a" stroke-width="1.4" /><text x="275.0" y="545.7" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="normal" fill="#222222">42, 63…</text></g>
  <text x="230" y="630" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#222222">Because Div(0) = &#x2115;, Div(21) &#x2229; Div(0) = Div(21), whose greatest element is 21.</text>
  <text x="230" y="648" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#00008b">Result: Gcd(21, 0) = {21}   (why Euclid returns a when b = 0!)</text>
  <rect x="460" y="372" width="420" height="290" rx="8" fill="#ffffff" stroke="#6e6e6e" stroke-width="1.5" />
  <rect x="460" y="372" width="420" height="40" rx="8" fill="#efedf9" stroke="#6A5ACD" stroke-width="1.2" />
  <text x="474" y="391" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#222222">Case D: Degenerate Corner (a = 0, b = 0) &#x2192; Gcd(0, 0) = {0}</text>
  <text x="474" y="406" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#43368a">Div(0) &#x2229; Div(0) = &#x2115;; only g = 0 is divisible by every d &#x2208; &#x2115;!</text>
  <rect x="474" y="420" width="392" height="190" rx="8" fill="#efedf9" fill-opacity="0.5" stroke="#6A5ACD" stroke-width="2.0" />
  <text x="486" y="438" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#43368a">P&#x2081;(g): g &#x2223; 0 = &#x2115;   and   P&#x2082;(g): g &#x2223; 0 = &#x2115;   (both expand to all of &#x2115;)</text>
<g><circle cx="515.0" cy="472.0" r="12.5" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="515.0" y="476.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">1</text></g>
<g><circle cx="553.0" cy="472.0" r="12.5" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="553.0" y="476.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">2</text></g>
<g><circle cx="591.0" cy="472.0" r="12.5" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="591.0" y="476.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">3</text></g>
<g><circle cx="629.0" cy="472.0" r="12.5" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="629.0" y="476.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">4</text></g>
<g><circle cx="667.0" cy="472.0" r="12.5" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="667.0" y="476.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">5</text></g>
<g><rect x="698.0" y="459.5" width="84.0" height="25.0" rx="12.5" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="740.0" y="476.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-weight="normal" fill="#222222">6, 7, 8, …</text></g>
  <text x="670" y="500" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" fill="#444444">All g &gt; 0 fail P&#x2083; (e.g. d = g+1 divides 0, but (g+1) &#x2224; g)</text>
  <ellipse cx="670" cy="554" rx="115" ry="44" fill="#d9d5f2" stroke="#00008b" stroke-width="2.6" stroke-dasharray="3,2" />
  <text x="628" y="546" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#43368a">P&#x2083;(g): &#x2200;d &#x2208; &#x2115;. d &#x2223; g</text>
  <text x="628" y="564" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" fill="#00008b">Gcd(0, 0) = {0}</text>
<g><circle cx="735.0" cy="554.0" r="17.0" fill="#e6eaf5" stroke="#00008b" stroke-width="2.6" /><text x="735.0" y="559.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#00008b">0</text></g>
  <text x="670" y="630" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#222222">Divisibility order (d &#x2223; g), not &#x2264;, makes 0 the top of the lattice (&#x2200;d. d &#x2223; 0).</text>
  <text x="670" y="648" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#00008b">Result: Gcd(0, 0) = {0} without any special case in the type!</text>
