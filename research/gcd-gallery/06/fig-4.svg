<g><rect x="672.8" y="225.0" width="62.4" height="22.0" rx="11.0" fill="#ffffff" stroke="#43368a" stroke-width="1.4" /><text x="704.0" y="239.7" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="normal" fill="#222222">42, 462</text></g>
<g><rect x="612.2" y="279.0" width="69.6" height="22.0" rx="11.0" fill="#ffffff" stroke="#43368a" stroke-width="1.4" /><text x="647.0" y="293.7" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="normal" fill="#222222">0, 84, …</text></g>
  <text x="670" y="324" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#222222">CommonDiv(1071, 462) = {1, 3, 7, 21}; P&#x2083; cuts {1, 3, 7} away.</text>
  <text x="670" y="342" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#00008b">Result: Gcd(1071, 462) = {21}</text>
  <rect x="20" y="372" width="420" height="290" rx="8" fill="#ffffff" stroke="#6e6e6e" stroke-width="1.5" />
  <rect x="20" y="372" width="420" height="40" rx="8" fill="#efedf9" stroke="#6A5ACD" stroke-width="1.2" />
  <text x="34" y="391" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#222222">Case C: Stopping Case (a = 21, b = 0) &#x2192; Gcd(21, 0) = {21}</text>
  <text x="34" y="406" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#43368a">Every d &#x2208; &#x2115; divides 0 (0 = d&#xB7;0), so P&#x2082;: Div(0) = &#x2115;!</text>
  <rect x="34" y="420" width="392" height="190" rx="8" fill="#f5f5eb" stroke="#6A5ACD" stroke-width="2.0" stroke-dasharray="6,3" />
  <text x="44" y="438" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#43368a">P&#x2082;(g): g &#x2223; 0 holds for ALL g &#x2208; &#x2115;  (Div(0) = &#x2115; is the whole box)</text>
  <circle cx="175" cy="526" r="62" fill="#efedf9" fill-opacity="0.8" />
  <circle cx="245" cy="526" r="62" fill="#efedf9" fill-opacity="0.8" />
