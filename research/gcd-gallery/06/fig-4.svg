  <text x="277" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#43368a">P&#x2082;: g &#x2223; 8</text>
<g><circle cx="130.0" cy="212.0" r="13.0" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.4" /><text x="130.0" y="216.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="normal" fill="#222222">13</text></g>
