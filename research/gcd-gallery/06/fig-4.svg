  <text x="34" y="85" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#222222">Case A: Coprime Inputs (a = 13, b = 8) &#x2192; Gcd(13, 8) = {1}</text>
  <text x="34" y="100" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#43368a">CommonDiv(13, 8) = {1}, so P&#x2083; (&#x2200;d&#x2208;{1}. d &#x2223; g) is all of &#x2115;!</text>
  <rect x="34" y="114" width="392" height="190" rx="8" fill="#f5f5eb" stroke="#43368a" stroke-width="1.8" stroke-dasharray="3,2" />
  <text x="44" y="131" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="bold" fill="#43368a">P&#x2083;(g): 1 &#x2223; g holds for ALL g &#x2208; &#x2115;  (P&#x2083; expands to the whole box)</text>
