<text x="36" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#222222" font-weight="bold" font-style="normal" text-anchor="start">In prime-exponent space, Div(n) is a box and gcd is the corner.</text>
<text x="36" y="56" font-family="'Arial Narrow', Arial, sans-serif" font-size="13" fill="#555555" font-weight="normal" font-style="normal" text-anchor="start">Concrete inputs a = 12 (2²·3¹) and b = 8 (2³·3⁰): each divisor d | n is a grid point inside the box [0, e₂(n)] × [0, e₃(n)].</text>
