<text x="384" y="474" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" fill="#00008b" font-weight="normal" font-style="normal" text-anchor="middle">(2³·3⁰)</text>
<circle cx="384" cy="308" r="3.5" fill="#cccccc" stroke="#888888" stroke-width="1"/>
<text x="392" y="302" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#888888" font-weight="normal" font-style="normal" text-anchor="start">24</text>
<circle cx="384" cy="186" r="3.5" fill="#cccccc" stroke="#888888" stroke-width="1"/>
<text x="392" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#888888" font-weight="normal" font-style="normal" text-anchor="start">72</text>
<circle cx="480" cy="430" r="3.5" fill="#cccccc" stroke="#888888" stroke-width="1"/>
<text x="488" y="424" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#888888" font-weight="normal" font-style="normal" text-anchor="start">16</text>
