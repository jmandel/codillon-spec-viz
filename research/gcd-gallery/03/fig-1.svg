<path d="M 411 418 L 445 402" fill="none" stroke="#00008b" stroke-width="1.4"/>
<rect x="445" y="383" width="139.04" height="16" fill="#fffff0" stroke="none" stroke-width="1" rx="3" ry="3" opacity="0.88"/>
<text x="449" y="396" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#00008b" font-weight="bold" font-style="normal" text-anchor="start">Div(8) = {1, 2, 4, 8}</text>
<rect x="445" y="399" width="116.68" height="15" fill="#fffff0" stroke="none" stroke-width="1" rx="3" ry="3" opacity="0.88"/>
<text x="449" y="411" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" fill="#00008b" font-weight="normal" font-style="normal" text-anchor="start">dotted box ≤ (3, 0)</text>
<path d="M 300 416 Q 318 365 338 344" fill="none" stroke="#6A5ACD" stroke-width="2.0" marker-end="url(#arrow-purple)"/>
<rect x="342" y="316" width="226" height="62" fill="#d9d5f2" stroke="#6A5ACD" stroke-width="1.8" rx="6" ry="6"/>
<text x="354" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#6A5ACD" font-weight="bold" font-style="normal" text-anchor="start">Type Gcd(12, 8) = { 4 }</text>
<text x="354" y="354" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Unique top-right corner of</text>
<text x="354" y="369" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#6A5ACD" font-weight="bold" font-style="normal" text-anchor="start">Div(12) ∩ Div(8) = {1, 2, 4}</text>
<rect x="592" y="92" width="276" height="290" fill="#f7f6eb" stroke="#cccccc" stroke-width="1.2" rx="8" ry="8"/>
<text x="608" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#222222" font-weight="bold" font-style="normal" text-anchor="start">Why a Box Has One Corner</text>
<line x1="608" y1="126" x2="852" y2="126" stroke="#cccccc" stroke-width="1"/>
<text x="608" y="148" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#222222" font-weight="bold" font-style="normal" text-anchor="start">1. Divisibility is coordinatewise ≤ :</text>
<text x="616" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">d | n   ⇔   e₂(d) ≤ e₂(n)  ∧  e₃(d) ≤ e₃(n)</text>
<text x="616" y="183" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#555555" font-weight="normal" font-style="normal" text-anchor="start">So Div(n) is the origin-anchored box ≤ n.</text>
<text x="608" y="210" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#222222" font-weight="bold" font-style="normal" text-anchor="start">2. Common divisors = box intersection:</text>
<text x="616" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Div(a) ∩ Div(b) = box ≤ min(e(a), e(b))</text>
<text x="616" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6A5ACD" font-weight="bold" font-style="normal" text-anchor="start">e₂: min(2, 3) = 2</text>
<text x="732" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6A5ACD" font-weight="bold" font-style="normal" text-anchor="start">e₃: min(1, 0) = 0</text>
<text x="608" y="274" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#6A5ACD" font-weight="bold" font-style="normal" text-anchor="start">3. The refinement type:</text>
<rect x="608" y="283" width="244" height="46" fill="#d9d5f2" stroke="#6A5ACD" stroke-width="1.2" rx="4" ry="4"/>
<text x="616" y="302" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#222222" font-weight="bold" font-style="normal" text-anchor="start">Gcd(12, 8) = { g ∈ ℕ |</text>
<text x="630" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#6A5ACD" font-weight="bold" font-style="normal" text-anchor="start">Div(g) = Div(12) ∩ Div(8) } = { 4 }</text>
<text x="608" y="350" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">Only g = 4 = 2²·3⁰ generates this exact</text>
<text x="608" y="365" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#222222" font-weight="normal" font-style="normal" text-anchor="start">purple box — making the type a singleton.</text>
</svg>