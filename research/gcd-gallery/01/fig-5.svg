  <text x="26" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="18.5" font-weight="bold" fill="#222222">Euclid's Algorithm Slides the Outer Cones Down to Their Invariant Meet</text>
  <text x="26" y="53" font-family="'Arial Narrow', Arial, sans-serif" font-size="12.5" fill="#555555">Each step (x, y) ↦ (y, x mod y) shrinks the upper cones while preserving Div(x) ∩ Div(y) = {1, 2, 4}, until y = 0 exposes x = 4 as the top.</text>
