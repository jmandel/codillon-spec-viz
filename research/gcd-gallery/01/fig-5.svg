  <text x="450" y="638" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#555555">At runtime all cones are erased, leaving only integer modulo steps—guaranteed to halt at the unique top element 4.</text>
