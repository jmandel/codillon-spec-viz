  <line x1="317.2" y1="354.2" x2="272.8" y2="305.8" stroke="#00008b" stroke-width="2.0" marker-end="url(#arrow-ink)"/>
  <line x1="118.5" y1="284.0" x2="183.5" y2="232.0" stroke="#00008b" stroke-width="2.0" marker-end="url(#arrow-ink)"/>
  <line x1="251.2" y1="282.2" x2="206.8" y2="233.8" stroke="#00008b" stroke-width="2.0" marker-end="url(#arrow-ink)"/>
  <circle cx="238.0" cy="438.0" r="15.5" fill="#ffffff" stroke="#6A5ACD" stroke-width="2.0"/>
  <text x="238.0" y="442.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#6A5ACD">1</text>
  <circle cx="172.0" cy="366.0" r="15.5" fill="#ffffff" stroke="#6A5ACD" stroke-width="2.0"/>
  <text x="172.0" y="370.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#6A5ACD">2</text>
  <circle cx="328.0" cy="366.0" r="15.5" fill="#ffffff" stroke="#00008b" stroke-width="2.0"/>
  <text x="328.0" y="370.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#00008b">3</text>
  <circle cx="106.0" cy="294.0" r="15.5" fill="#ffffff" stroke="#6A5ACD" stroke-width="2.0"/>
  <text x="106.0" y="298.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#6A5ACD">4</text>
  <circle cx="262.0" cy="294.0" r="15.5" fill="#ffffff" stroke="#00008b" stroke-width="2.0"/>
  <text x="262.0" y="298.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#00008b">6</text>
  <circle cx="196.0" cy="222.0" r="15.5" fill="#ffffff" stroke="#00008b" stroke-width="2.0"/>
  <text x="196.0" y="226.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#00008b">12</text>
  <rect x="40.0" y="484.0" width="388.0" height="88" rx="6" fill="#ece9fa" stroke="#6A5ACD" stroke-width="1.3"/>
  <text x="234.0" y="506.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="bold" fill="#222222">Order-Embedding Isomorphism:</text>
  <text x="234.0" y="528.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#6A5ACD">1 ∣ 2 ∣ 4 ∣ 12   ⟺   Div(1) ⊊ Div(2) ⊊ Div(4) ⊊ Div(12)</text>
  <text x="234.0" y="549.0" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#555555">Type-level subtyping {d | d ∣ g} ⊆ {d | d ∣ a} IS value-level g ∣ a.</text>
  <text x="234.0" y="565.0" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#555555">Greatest subtype inside Div(a) and Div(b) = intersection Div(a) ∩ Div(b).</text>
  <!-- Right Panel: Zero as Top Element of the Divisibility Lattice -->
  <rect x="458.0" y="82.0" width="416.0" height="505.0" rx="8" fill="#ffffff" stroke="#d8d6c8" stroke-width="1.6"/>
  <rect x="458.0" y="82.0" width="416.0" height="48" rx="8" fill="#ece9fa" stroke="#6A5ACD" stroke-width="1.4"/>
  <text x="472.0" y="103.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#6A5ACD">2. Edge Case b = 0: Why Gcd(12, 0) = {12}</text>
  <text x="472.0" y="122.0" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#555555">Since d · 0 = 0 for every d ∈ ℕ, every number divides 0:  Div(0) = ℕ</text>
  <rect x="476.0" y="144.0" width="380.0" height="328.0" rx="14" fill="#f3f1e4" stroke="#555555" stroke-width="2.0" stroke-dasharray="6,4"/>
  <text x="490.0" y="165.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#222222">Universal Down-Set Div(0) = ℕ (all natural numbers)</text>
  <circle cx="664.0" cy="196.0" r="19" fill="#ffffff" stroke="#222222" stroke-width="2.6"/>
  <text x="664.0" y="201.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#222222">0</text>
  <rect x="689.0" y="186.0" width="132" height="20" rx="4" fill="#222222"/>
  <text x="755.0" y="200.0" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">b = 0 (Top of ℕ, ∣)</text>
  <text x="490.0" y="200.0" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" font-style="italic" fill="#555555">∀n ∈ ℕ, n ∣ 0 (n·0 = 0)</text>
  <path d="M 515.4 322.4 Q 504.1 311.2 516.8 301.5 L 614.0 227.9 Q 626.7 218.2 638.0 229.5 L 772.6 363.6 Q 783.9 374.8 771.2 384.5 L 674.0 458.1 Q 661.3 467.8 650.0 456.5 Z" fill="#d9d5f2" fill-opacity="0.72" stroke="#6A5ACD" stroke-width="2.5"/>
  <line x1="544.0" y1="298.0" x2="637.6" y2="217.0" stroke="#555555" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow-ink)"/>
  <line x1="624.0" y1="240.0" x2="655.2" y2="217.0" stroke="#555555" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow-ink)"/>
  <line x1="684.0" y1="298.0" x2="668.4" y2="217.0" stroke="#555555" stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow-ink)"/>
  <line x1="653.2" y1="419.6" x2="614.8" y2="382.4" stroke="#6A5ACD" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <line x1="676.1" y1="421.2" x2="731.9" y2="380.8" stroke="#6A5ACD" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
