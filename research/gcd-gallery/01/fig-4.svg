  <line x1="616.1" y1="363.2" x2="671.9" y2="322.8" stroke="#6A5ACD" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <line x1="733.2" y1="361.6" x2="694.8" y2="324.4" stroke="#6A5ACD" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <line x1="556.1" y1="305.2" x2="611.9" y2="264.8" stroke="#6A5ACD" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <line x1="673.2" y1="303.6" x2="634.8" y2="266.4" stroke="#6A5ACD" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <circle cx="664.0" cy="430.0" r="14" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.6"/>
  <text x="664.0" y="434.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#222222">1</text>
  <circle cx="604.0" cy="372.0" r="14" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.6"/>
  <text x="604.0" y="376.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#222222">2</text>
  <circle cx="744.0" cy="372.0" r="14" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.6"/>
  <text x="744.0" y="376.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#222222">3</text>
  <circle cx="544.0" cy="314.0" r="14" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.6"/>
  <text x="544.0" y="318.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#222222">4</text>
  <circle cx="684.0" cy="314.0" r="14" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.6"/>
  <text x="684.0" y="318.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#222222">6</text>
  <circle cx="624.0" cy="256.0" r="18.5" fill="#d9d5f2" stroke="#6A5ACD" stroke-width="3.0"/>
  <circle cx="624.0" cy="256.0" r="14" fill="#ffffff" stroke="#6A5ACD" stroke-width="1.8"/>
  <text x="624.0" y="260.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#6A5ACD">12</text>
  <rect x="647.0" y="246.0" width="128" height="20" rx="4" fill="#6A5ACD"/>
  <text x="711.0" y="260.0" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">a = 12 = 12 ∧ 0 (TOP)</text>
  <rect x="472.0" y="484.0" width="388.0" height="88" rx="6" fill="#ece9fa" stroke="#6A5ACD" stroke-width="1.3"/>
  <text x="666.0" y="506.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="bold" fill="#6A5ACD">Div(12) ∩ Div(0)  =  Div(12) ∩ ℕ  =  Div(12)</text>
  <text x="666.0" y="528.0" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#222222">Intersecting with the whole universe ℕ leaves Div(12) unchanged!</text>
  <text x="666.0" y="548.0" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#00008b">• When y = 0 in Euclid’s algorithm, x = 12 ALREADY inhabits Gcd(12, 0).</text>
  <text x="666.0" y="565.0" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11.5" fill="#555555">• Even Gcd(0, 0) works: Div(0) ∩ Div(0) = ℕ = Div(0), with top element 0.</text>
  <text x="450" y="608" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#555555">Defining Gcd via Down-Set Equality Div(g) = Div(a) ∩ Div(b) handles 0 effortlessly without ad-hoc "greatest" exceptions.</text>
</svg>