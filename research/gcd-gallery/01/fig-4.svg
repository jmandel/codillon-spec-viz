  <rect x="0" y="0" width="900" height="625" fill="#fffff0"/>
  <!-- Title Banner -->
  <text x="26" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="18.5" font-weight="bold" fill="#222222">Divisibility IS Subtyping on Divisor Cones — and 0 Is the Universal Top</text>
  <text x="26" y="53" font-family="'Arial Narrow', Arial, sans-serif" font-size="12.5" fill="#555555">Because d ∣ n ⟺ Div(d) ⊆ Div(n), subtyping is set containment of down-sets; since every d divides 0, Div(0) = ℕ makes 0 the identity for ∧.</text>
  <rect x="620.0" y="15" width="254.0" height="22" rx="11" fill="#ece9fa" stroke="#6A5ACD" stroke-width="1.0"/>
  <text x="747.0" y="30" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" font-weight="bold" fill="#6A5ACD">FIG 4 · SUBTYPING &amp; ZERO TOP (12, 0)</text>
  <line x1="26" y1="64" x2="874" y2="64" stroke="#d8d6c8" stroke-width="1.2"/>
  <!-- Left Panel: Subtyping as Set Containment of Down-Sets -->
  <rect x="26.0" y="82.0" width="416.0" height="505.0" rx="8" fill="#ffffff" stroke="#d8d6c8" stroke-width="1.6"/>
  <rect x="26.0" y="82.0" width="416.0" height="48" rx="8" fill="#f3f1e4" stroke="#d8d6c8" stroke-width="1.2"/>
  <text x="40.0" y="103.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="bold" fill="#222222">1. Subtyping = Down-Set Containment</text>
  <text x="40.0" y="122.0" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#555555">Every divisibility edge d ∣ n is a subset inclusion Div(d) ⊆ Div(n)</text>
  <path d="M 69.7 304.9 Q 56.5 290.2 71.8 277.6 L 184.5 185.4 Q 199.8 172.9 213.1 187.6 L 364.3 355.1 Q 377.5 369.8 362.2 382.4 L 249.5 474.6 Q 234.2 487.1 220.9 472.4 Z" fill="#e2e6f7" fill-opacity="0.40" stroke="#00008b" stroke-width="1.8"/>
  <path d="M 86.1 312.2 L 218.1 456.2 A 27.0 27.0 0 0 0 257.9 419.8 L 125.9 275.8 A 27.0 27.0 0 0 0 86.1 312.2 Z" fill="#d9d5f2" fill-opacity="0.65" stroke="#6A5ACD" stroke-width="2.2"/>
  <path d="M 157.6 379.2 L 223.6 451.2 A 19.5 19.5 0 0 0 252.4 424.8 L 186.4 352.8 A 19.5 19.5 0 0 0 157.6 379.2 Z" fill="#ffffff" fill-opacity="0.75" stroke="#4b0082" stroke-width="1.8" stroke-dasharray="4,2"/>
  <text x="236.0" y="212.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#00008b">Div(12)</text>
  <text x="74.0" y="282.0" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#6A5ACD">Div(4)</text>
  <text x="144.0" y="372.0" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#4b0082">Div(2)</text>
  <line x1="227.2" y1="426.2" x2="182.8" y2="377.8" stroke="#6A5ACD" stroke-width="2.0" marker-end="url(#arrow-ink)"/>
  <line x1="250.5" y1="428.0" x2="315.5" y2="376.0" stroke="#00008b" stroke-width="2.0" marker-end="url(#arrow-ink)"/>
