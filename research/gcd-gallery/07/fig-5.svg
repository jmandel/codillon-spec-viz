<text x="41.0" y="110.0" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#222222" text-anchor="start" font-weight="bold">1. Duality: Divisors vs. Principal Ideals for (12, 8)</text>
<text x="41.0" y="128.0" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6A5ACD" text-anchor="start" font-weight="bold">d | a ∧ d | b   ⇔   aℤ ⊆ dℤ ∧ bℤ ⊆ dℤ   ⇔   (aℤ + bℤ) ⊆ dℤ</text>
<text x="117.0" y="152.0" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Common Divisors d</text>
<text x="117.0" y="166.0" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">(ordered by divisibility d₁ | d₂)</text>
<text x="360.0" y="152.0" font-family="'Arial Narrow', Arial, sans-serif" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">Enclosing Ideals dℤ</text>
<text x="360.0" y="166.0" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">(ordered by set inclusion ⊇)</text>
