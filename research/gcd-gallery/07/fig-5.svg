<rect x="25.0" y="16.0" width="850.0" height="58.0" fill="#eeecfa" stroke="#6A5ACD" stroke-width="1.2" rx="6" ry="6"/>
<text x="42.0" y="41.0" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#222222" text-anchor="start" font-weight="bold">Subtyping is ideal containment; boundary inputs (21, 0) and (0, 0) follow</text>
<text x="42.0" y="62.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#555555" text-anchor="start">Order-reversing duality: <tspan font-style="italic">d</tspan> divides <tspan font-style="italic">n</tspan>  ⇔  <tspan font-style="italic">n</tspan>ℤ ⊆ <tspan font-style="italic">d</tspan>ℤ, so greatest common divisor is the smallest enclosing ideal.</text>
